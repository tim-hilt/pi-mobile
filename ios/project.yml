name: PiMobile
options:
  bundleIdPrefix: dev.timhilt
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: 4333J2693Y
    GENERATE_INFOPLIST_FILE: YES
targets:
  PiMobile:
    type: application
    platform: iOS
    sources: [PiMobile]
    info:
      path: PiMobile/Info.plist
      properties:
        # Opens the bridge's pairing QR code (`pimobile://connect?…`) from the Camera app.
        CFBundleURLTypes:
          - CFBundleURLName: dev.timhilt.PiMobile
            CFBundleURLSchemes: [pimobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.timhilt.PiMobile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Pi Mobile"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the QR code shown by the bridge to log in."
  PiMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PiMobileTests]
    dependencies:
      - target: PiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.timhilt.PiMobileTests
schemes:
  PiMobile:
    build:
      targets:
        PiMobile: all
    test:
      targets: [PiMobileTests]
