name: PiClient
options:
  bundleIdPrefix: dev.timhilt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PiClient:
    type: application
    platform: iOS
    sources: [PiClient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.timhilt.PiClient
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PiClientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PiClientTests]
    dependencies:
      - target: PiClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.timhilt.PiClientTests
schemes:
  PiClient:
    build:
      targets:
        PiClient: all
    test:
      targets: [PiClientTests]
